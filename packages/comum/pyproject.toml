[project]
name = "comum"
version = "1.0.0"
description = "Infraestrutura compartilhada: config, logs, circuit breaker, Oracle, Kafka com retry/DLT e health"
requires-python = ">=3.15"
dependencies = [
    "aiokafka>=0.15.0",
    "oracledb>=26.1.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "fastapi>=0.162.5",
    "uvicorn>=0.54.0",
    "structlog>=26.1.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "comum"
