[project]
name = "solicitacao-service"
version = "1.0.0"
description = "Recebe solicitações de crédito, publica SolicitacaoCriada e repassa decisões ao SNS"
requires-python = ">=3.15"
dependencies = [
    "comum",
    "aiobotocore>=3.10.0",
    "email-validator>=2.3.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "solicitacao"

[tool.uv.sources]
comum = { workspace = true }
