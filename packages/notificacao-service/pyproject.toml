[project]
name = "notificacao-service"
version = "1.0.0"
description = "Consome as filas SQS e envia e-mail e push com a resposta da solicitação"
requires-python = ">=3.15"
dependencies = [
    "comum",
    "aiobotocore>=3.10.0",
    "aiosmtplib>=5.1.3",
    "httpx2>=2.16.0",
]

[project.scripts]
notificacao-service = "notificacao.main:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "notificacao"

[tool.uv.sources]
comum = { workspace = true }
